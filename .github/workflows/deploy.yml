name: 배포 (GitHub Pages)

# 기본 브랜치에 push 하면 빌드해서 GitHub Pages 로 배포한다.
# PR 에서는 배포 없이 빌드·타입검사만 돌려서 깨진 코드가 들어오는 것을 막는다.
#
# 최초 1회만 저장소 설정이 필요하다:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (Pages 사이트를 생성하는 권한은 워크플로 토큰에 없어서 자동화할 수 없다)
on:
  push:
    branches: [claude/vibe-coding-education-program-lgtqes, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write # Pages 배포에 필요
  id-token: write # 배포 인증 토큰 발급에 필요

# 배포가 겹치면 순서대로 처리한다. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # package-lock.json 그대로 설치한다 (npm install 과 달리 버전이 바뀌지 않는다)
      - run: npm ci

      - name: 빌드 (타입 검사 포함)
        run: npm run build
        env:
          # Pages 주소는 https://<계정>.github.io/<저장소>/ 이므로 하위 경로를 알려준다.
          # PR 빌드는 배포하지 않으니 루트로 둔다.
          VITE_BASE: ${{ github.event_name == 'pull_request' && '/' || format('/{0}/', github.event.repository.name) }}
          # STEP 06 실연동 데모에서 미리 채워줄 구글 OAuth 클라이언트 ID (선택).
          # 클라이언트 ID는 비밀값이 아니라 브라우저에 노출되는 공개 값이므로 secret 이 아니라 variable 로 둔다.
          # 설정하지 않으면 학습자가 화면에서 직접 입력한다.
          # Settings → Secrets and variables → Actions → Variables → GOOGLE_CLIENT_ID
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      # Pages 에는 SPA 폴백이 없다. 없는 경로에는 404.html 을 주므로
      # index.html 을 404.html 로 복사해두면 /steps/... 직접 진입·새로고침도 동작한다.
      - name: SPA 폴백 파일 생성
        run: cp dist/index.html dist/404.html

      # 링크·첨부로 돌릴 수 있는 단일 HTML 파일도 만들어 산출물로 올린다.
      # (Actions 실행 페이지 하단에서 내려받을 수 있다)
      - name: 단일 HTML 파일 빌드
        run: npm run build:artifact

      - uses: actions/upload-artifact@v4
        with:
          name: single-file-html
          path: artifact/vibe-coding-education.html
          if-no-files-found: error

      - name: Pages 산출물 업로드
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 저장소 설정에서 Pages Source 가 "GitHub Actions" 로 되어 있어야 성공한다.
      # 아직 아니라면 이 단계에서 멈춘다 — 설정 후 이 실행을 다시 돌리면 된다.
      - id: deployment
        uses: actions/deploy-pages@v4
