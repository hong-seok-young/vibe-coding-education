server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 브라우저 라우팅(SPA) — 어떤 경로로 들어와도 index.html 로 넘긴다.
  # 이게 없으면 /steps/orientation 을 새로고침할 때 404가 난다.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 해시가 붙은 정적 자산은 오래 캐시한다
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html 은 캐시하지 않는다 (배포 직후 새 버전이 바로 보이게)
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
